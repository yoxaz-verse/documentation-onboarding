    <path d="M 270 55 L 340 55 C 365 55 385 70 385 92.5 C 385 107 375 120 360 125 C 380 130 390 145 390 162.5 C 390 188 368 205 340 205 L 270 205 Z M 312 87 L 312 115 L 335 115 C 344 115 352 109 352 101 C 352 93 344 87 335 87 Z M 312 143 L 312 173 L 338 173 C 348 173 356 166 356 158 C 356 150 348 143 338 143 Z" fill="currentColor"/>

