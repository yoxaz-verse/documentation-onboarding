<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="502" height="502" x="5" y="5" rx="107" fill="none" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.4"/>

  <g transform="translate(46, 50) scale(1.65)">
    <!-- Outer Ring 'O' -->
    <path d="M 125 35 C 172 35 210 73 210 120 C 210 167 172 205 125 205 C 78 205 40 167 40 120 C 40 73 78 35 125 35 Z M 125 75 C 100 75 80 95 80 120 C 80 145 100 165 125 165 C 150 165 170 145 170 120 C 170 95 150 75 125 75 Z" fill="#FFFFFF"/>
    
    <!-- Pin Node inside 'O' -->
    <circle cx="125" cy="120" r="22" fill="none" stroke="url(#gold-grad)" stroke-width="12"/>
    <circle cx="125" cy="120" r="8" fill="#FFFFFF"/>

    <!-- Golden Pin Stem & Underline Wire -->
    <path d="M 119 120 L 131 120 L 131 190 L 225 190 C 232 190 238 184 238 177 L 238 140 L 250 140 L 250 177 C 250 191 239 202 225 202 L 119 202 Z" fill="url(#gold-grad)"/>
  </g>
</svg>
